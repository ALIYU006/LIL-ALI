<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliyu - My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="aliyu.jepeg.jpeg" alt="Aliyu's Profile Picture" class="profile-picture">

        <h1>Hi, I'm Aliyu</h1>
        <p id="subtitle"></p>
        <p>Web Developer & IT Student</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#hobbies">Hobbies</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>

        <section class="top-section">

            <div class="card" id="about">
                <h2>About Me</h2>
                <p>
                    My name is Aliyu. I am learning web development
                    because I want to build useful and interesting
                    websites.
                </p>
            </div>

            <div class="card" id="hobbies">
                <h2>Things I Enjoy</h2>

                <div class="hobbies">
                    <span>Coding</span>
                    <span>Technology</span>
                    <span>Learning</span>
                    <span>Music</span>
                    <span>Football</span>
                    <span>Gaming</span>
                </div>
            </div>

        </section>

        <section class="card contact" id="contact">
            <h2>Get In Touch</h2>

            <form>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Your name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example,com"
                    required
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    placeholder="Say hello..."
                    required
                ></textarea>

                <button type="submit">Send</button>
            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 Aliyu. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
